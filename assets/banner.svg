<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <circle cx="1120" cy="60" r="180" fill="#6366f1" opacity="0.08"/>
  <circle cx="180" cy="280" r="140" fill="#22d3ee" opacity="0.08"/>

  <!-- Document icon -->
  <g transform="translate(120,90)">
    <rect x="0" y="0" width="110" height="140" rx="10" fill="url(#accent)" opacity="0.15"/>
    <rect x="0" y="0" width="110" height="140" rx="10" stroke="url(#accent)" stroke-width="3"/>
    <path d="M75 0 L110 35 L75 35 Z" fill="url(#accent)" opacity="0.6"/>
    <line x1="20" y1="65" x2="90" y2="65" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="85" x2="90" y2="85" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="105" x2="60" y2="105" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Chat bubble -->
  <g transform="translate(200,60)">
    <path d="M0 20 Q0 0 20 0 L120 0 Q140 0 140 20 L140 90 Q140 110 120 110 L40 110 L10 140 L10 110 Q0 110 0 90 Z"
          fill="url(#accent)" opacity="0.9"/>
    <circle cx="40" cy="55" r="6" fill="#0f172a"/>
    <circle cx="70" cy="55" r="6" fill="#0f172a"/>
    <circle cx="100" cy="55" r="6" fill="#0f172a"/>
  </g>

  <!-- Text -->
  <text x="430" y="155" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="76" font-weight="800" fill="#f8fafc">PDF RAG</text>
  <text x="432" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="500" fill="#94a3b8">Chat with your PDFs — powered by Retrieval-Augmented Generation</text>

  <!-- Tag pills -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
    <rect x="432" y="230" width="110" height="34" rx="17" fill="#6366f1" opacity="0.2"/>
    <text x="452" y="253" fill="#a5b4fc">Next.js</text>
    <rect x="552" y="230" width="100" height="34" rx="17" fill="#22d3ee" opacity="0.2"/>
    <text x="570" y="253" fill="#67e8f9">Express</text>
    <rect x="662" y="230" width="120" height="34" rx="17" fill="#6366f1" opacity="0.2"/>
    <text x="680" y="253" fill="#a5b4fc">Pinecone</text>
    <rect x="792" y="230" width="100" height="34" rx="17" fill="#22d3ee" opacity="0.2"/>
    <text x="812" y="253" fill="#67e8f9">BullMQ</text>
  </g>
</svg>
